<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow:hidden;
    background:radial-gradient(circle at top,#0a0a1d,#05050d 70%);
}

.card{
    width:100%;
    max-width:430px;
    background:linear-gradient(145deg,#11111c,#1a1a38);
    border-radius:35px;
    padding:35px 24px;
    text-align:center;
    position:relative;
    border:1px solid rgba(255,255,255,0.05);
    box-shadow:
    0 0 40px rgba(0,0,0,0.7),
    inset 0 0 20px rgba(255,255,255,0.02);

    margin:auto;
}

.profile-wrap{
    width:130px;
    height:130px;
    margin:auto;
    border-radius:50%;
    padding:5px;
    background:#00ff84;
    box-shadow:
    0 0 15px #00ff84,
    0 0 40px rgba(0,255,132,.5);
}

.profile-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #131326;
}

h1{
    margin-top:28px;
    color:#ffbf1f;
    font-size:38px;
    font-weight:800;
    line-height:1.2;
    text-shadow:0 0 12px rgba(255,191,31,.25);
}

.subtitle{
    margin-top:18px;
    color:#f1f1f1;
    font-size:22px;
    line-height:1.6;
    font-weight:400;
}

.subtitle span{
    color:#00ff84;
    font-weight:700;
}

.timer-box{
    margin-top:30px;
    background:#0d1020;
    border:2px solid rgba(0,255,132,0.15);
    border-radius:20px;
    padding:20px;
    color:#fff;
    font-size:23px;
    font-weight:600;
}

.count{
    color:#ffbf1f;
    font-size:38px;
    font-weight:800;
}

.join-btn{
    width:100%;
    display:block;
    margin-top:32px;
    padding:24px 10px;
    border-radius:22px;
    background:#ff9800;
    text-decoration:none;
    color:#000;
    font-size:30px;
    font-weight:800;
    box-shadow:
    0 10px 0 #c96f00,
    0 0 30px rgba(255,152,0,.35);
    transition:.15s;
}

.join-btn:active{
    transform:translateY(5px);
    box-shadow:
    0 5px 0 #c96f00,
    0 0 20px rgba(255,152,0,.35);
}

.bottom-text{
    margin-top:30px;
    color:#d7d7d7;
    font-size:18px;
    line-height:1.8;
}

.footer{
    margin-top:28px;
    color:#8f93ad;
    font-size:15px;
    letter-spacing:2px;
    font-weight:600;
}

@media(max-width:480px){

    .card{
        max-width:100%;
        padding:30px 20px;
    }

    h1{
        font-size:33px;
    }

    .subtitle{
        font-size:20px;
    }

    .join-btn{
        font-size:26px;
    }
}

</style>
</head>

<body>

<div class="card">

    <div class="profile-wrap">
        <img src="https://i.ibb.co/G7J6v6F/photo.jpg">
    </div>

    <h1>JAI CLUB OFFICIAL</h1>

    <div class="subtitle">
        Join the Fast Growing Community<br>
        Get <span>Regular Updates & Insights 🔥</span>
    </div>

    <div class="timer-box">
        ⚡ Free access closes in
        <span class="count" id="count">9</span>
        s
    </div>

    <a href="https://t.me/" class="join-btn">
        🚀 JOIN TELEGRAM NOW
    </a>

    <div class="bottom-text">
        ✅ Trusted by Thousands of Members<br>
        🔒 For Educational Purpose Only
    </div>

    <div class="footer">
        © ADS MANAGED BY TG @TOPSADAGENCY
    </div>

</div>

<script>

let count = 9;

setInterval(() => {

    count--;

    if(count <= 0){
        count = 9;
    }

    document.getElementById("count").innerText = count;

},1000);

</script>

</body>
</html>
