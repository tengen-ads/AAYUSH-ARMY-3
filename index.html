<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jai Club Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:radial-gradient(circle at top,#12142d,#050510);
      padding:20px;
    }

    .card{
      width:390px;
      max-width:100%;
      border-radius:35px;
      padding:38px 25px;
      text-align:center;
      background:linear-gradient(145deg,#12141d,#19183c);
      box-shadow:0 0 40px rgba(0,0,0,.6);
      color:white;
    }

    .profile{
      width:145px;
      height:145px;
      border-radius:50%;
      margin:auto;
      border:5px solid #00ff8c;
      box-shadow:0 0 25px #00ff8c;
      overflow:hidden;
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h1{
      margin-top:30px;
      color:#ffb400;
      font-size:34px;
      font-weight:800;
    }

    .sub{
      margin-top:18px;
      font-size:18px;
      line-height:1.6;
      color:#ddd;
    }

    .green{color:#00ff7b;font-weight:700;}

    .timer{
      margin-top:30px;
      border:1px solid rgba(0,255,136,.3);
      border-radius:20px;
      padding:22px;
      font-size:20px;
      font-weight:600;
    }

    .timer span{
      color:#ffb400;
      font-size:34px;
      font-weight:800;
    }

    .btn{
      margin-top:35px;
      display:block;
      text-decoration:none;
      color:black;
      background:#ffa500;
      padding:28px;
      border-radius:22px;
      font-size:24px;
      font-weight:800;
      box-shadow:0 10px 0 #d16f00,0 0 30px rgba(255,165,0,.4);
    }

    .footer{
      margin-top:35px;
      color:#cfcfcf;
      font-size:16px;
      line-height:1.8;
    }

    .copy{
      margin-top:35px;
      opacity:.55;
      font-size:14px;
      letter-spacing:2px;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="profile">
      <!-- APNI IMAGE KA LINK YAHAN DALO -->
      <img src="YOUR-IMAGE.jpg" alt="profile">
    </div>

    <h1>JAI CLUB OFFICIAL</h1>

    <p class="sub">
      Join the Fast Growing Community<br>
      Get <span class="green">Regular Updates & Insights 🔥</span>
    </p>

    <div class="timer">
      ⚡ Free access closes in <span id="count">9</span> s
    </div>

    <!-- APNA TELEGRAM LINK -->
    <a href="https://t.me/yourchannel" class="btn">
      🚀 JOIN TELEGRAM NOW
    </a>

    <div class="footer">
      ✅ Trusted by Thousands of Members<br>
      🔒 For Educational Purpose Only
    </div>

    <div class="copy">
      © ADS MANAGED BY TG @TOPSADAGENCY
    </div>

  </div>

  <script>
    let n=9;
    setInterval(()=>{
      if(n>0){
        n--;
        document.getElementById('count').innerText=n;
      }
    },1000)
  </script>

</body>
</html>
